    <linearGradient id="bevel" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe58a"/><stop offset=".5" stop-color="#e7a628"/><stop offset="1" stop-color="#9a5a0a"/></linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset=".5" stop-color="#ffc23d"/><stop offset="1" stop-color="#c27c12"/></linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".55" stop-color="#f7bd3a"/><stop offset="1" stop-color="#c98418"/></linearGradient>
