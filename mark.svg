    <path d="M-21 11 L-24 -11 L-11 0 L0 -16 L11 0 L24 -11 L21 11 Z M-21 14 H21 V19 H-21 Z" fill="#fff8d6" fill-opacity=".9" transform="translate(-1 -1)"/>
    <path d="M-21 11 L-24 -11 L-11 0 L0 -16 L11 0 L24 -11 L21 11 Z M-21 14 H21 V19 H-21 Z" fill="url(#crown)"/>
    <circle cx="-24" cy="-13.5" r="3.2" fill="url(#crown)" stroke="#a8670c" stroke-width=".8"/>
    <circle cx="0" cy="-18.5" r="3.4" fill="url(#crown)" stroke="#a8670c" stroke-width=".8"/>
    <circle cx="24" cy="-13.5" r="3.2" fill="url(#crown)" stroke="#a8670c" stroke-width=".8"/>
